# vision parameters
vision:
  target_class:           1
  confidence:             0.2

# Controller parameters 
controller:
  Kp:                     [0.01 , -0.005]
  Kd:                     [-0.000, -0.00]
  
  frequency:              50        # Frequency of the control node
  time_delay:             0.1         # Expected time delay during fire (s)

  err_p_track:            1e-3        # Error threshold for tracking, position  (pixel)
  err_v_track:            1e-3        # Error threshold for tracking, velocity  (pixel/s)
  err_p_fire:             1e-3        # Error threshold for aim, position       (pixel)


# Estimator parameters 
estimator:
  prediction_time:        0.15

  camera:
    focal_length:         0.01
  kalman:
    q_acc:                1e+5
    r_detected:           10.0
    r_tracked:            10.0
    r_temp_vel:           900
    r_temp_acc:           54000
    p0_pos:               10.0
    p0_vel:               900
    p0_acc:               54000
    max_time_gap:         0.15
  


bridge:
  serial:
    name:                 "usb"
    port:                 "/dev/ttyACM0"  # Read/write bridge frames
    baud:                 115200
    data_bits:            8
    stop_bits:            1
    parity:               0
    watchdog_frequency:   200
