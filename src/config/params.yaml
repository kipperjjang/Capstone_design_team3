# vision parameters
vision:
  target_class:           1
  confidence:             0.2

# Camera calibration parameters for each camera.
# Replace each camera's values with the output from scripts/camera_calibration.py.
# camera_matrix is row-major:
#   [fx, 0, cx,
#    0, fy, cy,
#    0, 0, 1]
calibration:
  webcam:
    image_width:            1920
    image_height:           1080
    camera_matrix:          [ 1.4245508350197540e+03, 0., 9.5248078876722877e+02, 0.,
       1.4206396947024539e+03, 6.2725130506202265e+02, 0., 0., 1. ]
    distortion_coefficients: [ -4.4238078535861508e-01, -4.1238530690611865e+00,
       3.7843542193830002e-02, -2.9627641045273457e-03,
       -2.5280770110601608e+01, -4.8596428108007222e-01,
       -3.8081326036232923e+00, -2.5902347908928107e+01,
       5.7580947043199219e-03, 6.4134328602331356e-02,
       -4.5238420442769885e-02, -7.9640773972741667e-03 ]
  picam:
    image_width:            1280
    image_height:           720
    camera_matrix:          [ 3.4871087963171217e+03, 0., 6.9487472593386030e+02, 0.,
       3.4856105158491973e+03, 3.0729830392378335e+02, 0., 0., 1. ]
    distortion_coefficients: [ 6.0895923510688499e+02, -1.8325713951584017e+01,
       -3.2101856015831390e-02, -4.3692858476937740e-02,
       -1.3311456330522022e+00, 6.1479690583062290e+02,
       2.4628539198838268e+01, 1.3045414666647437e+00,
       4.7586253753540017e-02, 1.8484701759308766e+00,
       1.1130387953134027e-01, -6.5022652430000250e-01 ]



# Controller parameters 
controller:
  image_offset:           [30.0, 100.0]
  angle_offset:           [0.0, 0.0]
  Kp:                     [0.01 , -0.005] 
  Kd:                     [0.000, 0.00]
  
  frequency:              50        # Frequency of the control node
  time_delay:             0.1         # Expected time delay during fire (s)

  err_p_track:            1e-3        # Error threshold for tracking, position  (pixel)
  err_v_track:            1e-3        # Error threshold for tracking, velocity  (pixel/s)
  err_p_fire:             1e-3        # Error threshold for aim, position       (pixel)


# Estimator parameters 
estimator:
  prediction_time:        0.1

  camera:
    focal_length:         0.01
  kalman:
    q_acc:                1e+5
    r_detected:           10.0
    r_tracked:            10.0
    r_temp_vel:           900
    r_temp_acc:           54000
    p0_pos:               10.0
    p0_vel:               900
    p0_acc:               54000
    max_time_gap:         0.5
  


bridge:
  serial:
    name:                 "usb"
    read_port:            "/dev/ttyTHS1"  # Read frame
    write_port:           "/dev/ttyACM0"  # Write frame
    baud:                 115200
    data_bits:            8
    stop_bits:            1
    parity:               0
    watchdog_frequency:   200
