# vision parameters
vision:
  weight_confidence:      1.0         # Weight for confidence score; select bbox of high confidence
  weight_distance:        0.002       # Weight for distance score; select bbox which is closer to the previous detection

# Controller parameters 
controller:
  image_offset:           [0.0, 0.0]
  pixel_offset:           [0.0, 0.0]
  edge_joint_threshold:   [5e-2, 1e-2]
  vel_norm_threshold:     1e-1
  Kp:                     [0.003 , -0.0005] 
  Kd:                     [0.000, 0.00]
  
  frequency:              50        # Frequency of the control node
  time_delay:             0.1         # Expected time delay during fire (s)
  picam_track_reuse_sec:  0.25        # Max duration to reuse last filtered picam YOLO pixel
  picam_track_hold_sec:   1.0         # Max duration to hold current joint before webcam handoff
  webcam_measurement_max_age: 0.5     # Max age of webcam YOLO measurement for search
  picam_lpf_enabled:      true        # Smooth picam YOLO pixel jitter before pixel control
  picam_lpf_alpha:        0.2         # filtered = alpha * previous + (1-alpha) * measurement
  picam_lpf_reset_gap_sec: 0.25       # Reset LPF after long picam detection gap

# Serial parameters
bridge:
  serial:
    name:                 "usb"
    port:                 "/dev/ttyACM0"
    baud:                 115200
    data_bits:            8
    stop_bits:            1
    parity:               0
    watchdog_frequency:   200
    write_frequency:      50

# Camera calibration parameters for each camera.
